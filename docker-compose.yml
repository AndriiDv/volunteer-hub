services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: volunteer_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d volunteer_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: volunteer_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/volunteer_hub
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-volunteer-hub-2026-secure}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-north-1}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-volunteer-hub-media-andriidv}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - vh-network

  nginx:
    image: nginx:alpine
    container_name: volunteer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - vh-network

volumes:
  postgres_data:

networks:
  vh-network:
    driver: bridge
